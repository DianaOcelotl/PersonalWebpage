<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<style>
    /* [Keep your exact original CSS block here] */
    * { margin: 0;
        padding: 0;
        box-sizing: border-box;
        text-decoration: none;
        border: none;
        outline: none;
        font-family: 'Montserrat', sans-serif;
    }
    html {
        font-size: 62.5%;
        scroll-behavior: smooth;
    }
    body { width: 100%;
        height: 100vh;
        overflow-x: hidden;
    }
    header { margin-top: 20px;
        position: fixed;
        top: 0; left: 0;
        width: 100%;
        padding: 1rem 9%;
        background-color: transparent;
        filter: drop-shadow(1px 1px 1px rgba(0, 0, 0, 0.2));
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
    }
    .logo {
        font-size: 3rem;
        color: red;
        font-weight: 800;
        cursor: pointer;
        transition: .5s ease;
    }
    .logo:hover {
        transform: scale(1.1);
    }
    nav a {
        font-size: 1.8rem;
        color: white;
        margin-left: 4rem;
        font-weight: 500;
        transition: .3s ease;
        border-bottom: 3px solid transparent;
    }
    nav a:hover, nav a.active {
        color: red;
        border-bottom: 3px solid red;
    }
    .home {
        display:flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 9%;
        width: 100%;
        height: 100vh;
        background-color: #000000; }
    .home-content h1 {
        font-size: 3.2rem;
        font-weight: 700;
        color: white;
    }
    .home-content h2 {
        font-size: 5.6rem;
        font-weight: 700;
        color: white;
    }
    .home-content h3 {
        font-size: 1.5rem;
        font-weight: 600;
        color: white;
    }
    .home-image img {
        position: relative;
        width: 30vw;
        border-radius: 50%;
    }
    .social-icons { position: fixed;
        top: 50%;
        left: 2.5rem;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 1.8rem;
        z-index: 200;
    }
    .social-icons a {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 4.5rem;
        height: 4.5rem;
        background: transparent;
        border: 2px solid red;
        border-radius: 50%;
        font-size: 2rem;
        color: red;
        transition: .4s ease;
    }
    .social-icons a:hover {
        background-color: red;
        color: white;
        box-shadow: 0 0 15px red;
    }
    .about-content h4 {
        padding: 25px 25px;
        display: inline-flex;
        margin-top: 3rem;
        border: 5px solid #333;
        border-radius: 30px;
        font-size: 1.5rem;
        color: white;
    }
</style>

    <a href="mailto:dianaocelotlgarcia@gmail.com" target="_blank"><i class="fa fa-envelope"></i></a>
